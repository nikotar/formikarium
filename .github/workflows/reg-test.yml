name: REG.RU test deployment
on:
  push:
    branches: [preview]
    paths:
      - 'index.html'
      - '.github/workflows/reg-test.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to theantmill.online after checking FTPS
        type: boolean
        default: false
concurrency:
  group: reg-test
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify encrypted FTP connection
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --fail --silent --show-error --ssl-reqd --connect-timeout 20 --max-time 60 --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/" --list-only
      - name: Prepare self-contained test build
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          mkdir -p deploy/assets
          cp index.html deploy/index.html
          curl --fail --silent --show-error --location --retry 3 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2' -o deploy/assets/supabase.js
          curl --fail --silent --show-error --location --retry 3 -A 'Mozilla/5.0' 'https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&display=swap' -o deploy/assets/oswald.css
          python3 - <<'PY'
          import pathlib, re, urllib.request
          root = pathlib.Path('deploy')
          css = root / 'assets/oswald.css'
          data = css.read_text()
          urls = set(re.findall(r'https://fonts\.gstatic\.com/[^)\s]+', data))
          assert urls, 'No font files found'
          for i, url in enumerate(sorted(urls)):
              name = 'oswald-' + str(i) + '.' + url.rsplit('.', 1)[-1]
              urllib.request.urlretrieve(url, root / 'assets' / name)
              data = data.replace(url, name)
          css.write_text(data)
          html = root / 'index.html'
          data = html.read_text()
          replacements = {
              'https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&display=swap': './assets/oswald.css',
              'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2': './assets/supabase.js',
          }
          for old, new in replacements.items():
              assert old in data, old
              data = data.replace(old, new)
          # Session persistence patch.
          changes = [
              ("if(btn.dataset.tab==='admin'&&admin){$('logout').click();return;}", ""),
              ("#logout{display:none!important;}", "#logout{margin:8px 0;padding:6px 12px;border-radius:999px;cursor:pointer}"),
              ("await db.auth.signOut();await reload();setInterval", "const session=checked(await db.auth.getSession()).session;if(session){const user=checked(await db.auth.getUser()).user;if(user?.id===ownerId){admin=true;$('loginBox').style.display='none';$('adminContent').style.display='block';$('logout').style.display='inline-block';}else{checked(await db.auth.signOut());}}await reload();setInterval"),
          ]
          for old, new in changes:
              assert data.count(old) == 1, old
              data = data.replace(old, new)
          for old, new in [
              ("@media(max-width:760px){.calendar-nav:has(.ant-week) strong{flex-basis:190px;width:190px}}", "@media(max-width:760px){.calendar-nav:has(.ant-week) strong{flex-basis:160px;width:160px}}"),
              ("@media(max-width:340px){.calendar-nav:has(.ant-week) strong{flex-basis:160px;width:160px}}", "@media(max-width:340px){.calendar-nav:has(.ant-week) strong{flex-basis:140px;width:140px}}"),
          ]:
              assert data.count(old) == 1, old
              data = data.replace(old, new)
          logo = re.search(r'<div class="logo"[^>]*>\s*(<svg\b.*?</svg>)', data, re.S)
          assert logo, 'Header logo not found'
          (root / 'assets/favicon.svg').write_text(logo.group(1))
          data = data.replace('</head>', '<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg"></head>', 1)
          data = data.replace('</head>', '<link rel="icon" type="image/png" sizes="64x64" href="./assets/favicon.png?v=2"></head>', 1)
          data = data.replace('</head>', '<style>:is(#calendar,#ownerCalendar) .slot.booked .inner[data-short="1"]{gap:2px;justify-content:center}:is(#calendar,#ownerCalendar) .inner[data-short="1"] .booking-name{line-height:1.15}:is(#calendar,#ownerCalendar) .inner[data-short="1"] .booking-time{line-height:1.15}@media(max-width:760px) and (orientation:portrait){:is(#calendar,#ownerCalendar) .inner[data-short="1"] .booking-name{line-height:9px}:is(#calendar,#ownerCalendar) .inner[data-short="1"] .booking-time{line-height:8px}}</style></head>', 1)
          data = re.sub(r'<link rel="icon"[^>]*>', '', data)
          data = data.replace('</head>', '<link rel="shortcut icon" href="./assets/favicon.ico?v=3" type="image/x-icon"><link rel="icon" href="./assets/favicon.ico?v=3" sizes="16x16 32x32 48x48" type="image/x-icon"><link rel="apple-touch-icon" href="./assets/apple-touch-icon.png"></head>', 1)
          assert data.count("const db=window.supabase?.createClient(") == 1
          data = data.replace("const db=window.supabase?.createClient(", "const proxyFetch=(input,init)=>{const u=new URL(typeof input==='string'||input instanceof URL?input:input.url);if(u.origin!=='https://aqtupxpsqztihffplwpq.supabase.co')return fetch(input,init);const p=new URL('./assets/supabase-proxy.php',location.href);p.searchParams.set('path',u.pathname);p.searchParams.set('query',u.search.slice(1));const h=new Headers(init?.headers||(input instanceof Request?input.headers:undefined));if(h.has('authorization'))h.set('X-Proxy-Authorization',h.get('authorization'));return fetch(input instanceof Request?new Request(p,input):p,{...init,headers:h});};const db=window.supabase?.createClient(", 1)
          data,n = re.subn(r"(const db=window\.supabase\?\.createClient\('[^']+','[^']+')\);", r"\1,{global:{fetch:proxyFetch}});", data)
          assert n == 1
          html.write_text(data)
          PY
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 64 -h 64 deploy/assets/favicon.svg -o deploy/assets/favicon.png
          rsvg-convert -w 192 -h 192 deploy/assets/favicon.svg -o deploy/assets/favicon.png
          rsvg-convert -w 180 -h 180 deploy/assets/favicon.svg -o deploy/assets/apple-touch-icon.png
          python3 -m pip install Pillow
          python3 - <<'ANTPY'
          import pathlib, re, base64, io
          from PIL import Image, ImageDraw
          html = pathlib.Path('deploy/index.html')
          data = html.read_text()
          pattern = r'<img class="mobile-crawling-ant"[^>]*src="data:image/png;base64,([^"]+)"[^>]*>'
          matches = list(re.finditer(pattern, data))
          assert len(matches) == 2 and matches[0][1] == matches[1][1], 'Unexpected ant markup'
          orig = Image.open(io.BytesIO(base64.b64decode(matches[0][1]))).convert('RGBA')
          assert orig.size == (410,190)
          paths = [[(4,63),(20,45),(40,31),(60,20),(80,12),(105,8),(125,13),(145,28),(165,48),(180,69),(193,91)],[(230,96),(246,78),(265,60),(285,44),(305,34),(326,28),(342,31),(360,41),(380,58),(395,75),(403,92)]]
          masks = []
          for i, pts in enumerate(paths):
              wide = Image.new('L',orig.size)
              ImageDraw.Draw(wide).line(pts,fill=255,width=19,joint='curve')
              narrow = Image.new('L',orig.size)
              ImageDraw.Draw(narrow).line(pts,fill=255,width=9,joint='curve')
              for y in range(190):
                  for x in range(410):
                      if y>=68 and 158<=x<=257:
                          wide.putpixel((x,y),narrow.getpixel((x,y)))
                      if (i==0 and x<158 and y<100) or (i==1 and x>=258 and y<105):
                          wide.putpixel((x,y),255)
              masks.append(wide)
          body = Image.new('L',orig.size)
          for y in range(190):
              for x in range(410):
                  a,b = (m.getpixel((x,y)) for m in masks)
                  assert not (a and b)
                  body.putpixel((x,y),0 if a or b else 255)
          parts = []
          for cls, mask in zip(['ant-body','antenna-left','antenna-right'],[body,*masks]):
              layer = Image.new('RGBA',orig.size)
              layer.paste(orig,(0,0),mask)
              buf = io.BytesIO()
              layer.save(buf,format='PNG')
              parts.append('<img class="'+cls+'" alt="" src="data:image/png;base64,'+base64.b64encode(buf.getvalue()).decode()+'">')
          data,n = re.subn(pattern,lambda _: '<span class="mobile-crawling-ant" aria-hidden="true">'+''.join(parts)+'</span>',data)
          assert n == 2
          css = '.mobile-crawling-ant{aspect-ratio:410/190}.mobile-crawling-ant>img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}.mobile-crawling-ant .antenna-left{transform-origin:46.8% 45%;animation:ant-sway 4.8s ease-in-out infinite}.mobile-crawling-ant .antenna-right{transform-origin:55% 45%;animation:ant-sway 6.2s ease-in-out infinite reverse}@keyframes ant-sway{0%,100%{transform:rotate(0deg)}25%{transform:rotate(12deg)}75%{transform:rotate(-12deg)}}@media(prefers-reduced-motion:reduce){.mobile-crawling-ant>img{animation:none!important}}'
          data = data.replace('</head>','<style>'+css+'</style></head>',1)
          html.write_text(data)
          ANTPY
          python3 -c "from PIL import Image; Image.open('deploy/assets/favicon.png').save('deploy/assets/favicon.ico', sizes=[(16,16),(32,32),(48,48)])"
          test -s deploy/assets/favicon.ico
          test -s deploy/assets/favicon.png
          test -s deploy/assets/supabase.js
          cat > deploy/assets/supabase-probe.php <<'PROBEPHP'
          <?php
          header('Cache-Control: no-store');
          header('Content-Type: application/json; charset=utf-8');
          if (!extension_loaded('curl')) { http_response_code(503); echo json_encode(['curl'=>false]); exit; }
          $c = curl_init('https://aqtupxpsqztihffplwpq.supabase.co/rest/v1/');
          curl_setopt_array($c,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_CONNECTTIMEOUT=>5,CURLOPT_TIMEOUT=>12,CURLOPT_FOLLOWLOCATION=>false,CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2]);
          $result=curl_exec($c);
          $status=curl_getinfo($c,CURLINFO_HTTP_CODE);
          curl_close($c);
          echo json_encode(['curl'=>true,'upstream_reachable'=>$result!==false && $status>0,'upstream_http_status'=>$status]);
          PROBEPHP
          cat > deploy/assets/supabase-proxy.php <<'PROXYPHP'
          <?php
          header('Cache-Control: no-store');
          function fail_request($status) { http_response_code($status); header('Content-Type: application/json'); echo '{"message":"Proxy request failed"}'; exit; }
          $path = $_GET['path'] ?? '';
          $method = $_SERVER['REQUEST_METHOD'];
          $allowed = [
           '/rest/v1/groups'=>['GET','HEAD','POST'],
           '/rest/v1/bookings'=>['GET','HEAD','POST','PATCH','DELETE'],
           '/rest/v1/studio_rates'=>['GET','HEAD','POST','PATCH','DELETE'],
           '/rest/v1/rpc/create_own_booking'=>['POST'],
           '/rest/v1/rpc/edit_own_booking'=>['POST'],
           '/rest/v1/rpc/cancel_own_booking'=>['POST'],
           '/auth/v1/token'=>['POST'],
           '/auth/v1/user'=>['GET'],
           '/auth/v1/logout'=>['POST']
          ];
          if (!is_string($path) || !isset($allowed[$path]) || !in_array($method,$allowed[$path],true)) fail_request(403);
          $q = $_GET['query'] ?? '';
          if (!is_string($q) || strlen($q)>8192 || preg_match('/[\x00-\x20#]/',$q)) fail_request(400);
          if ((int)($_SERVER['CONTENT_LENGTH'] ?? 0)>65536) fail_request(413);
          $body=file_get_contents('php://input',false,null,0,65537);
          if (strlen($body)>65536) fail_request(413);
          $headers=[];
          foreach (['Authorization','Apikey','Content-Type','Accept','Prefer','Range','Range-Unit','Accept-Profile','Content-Profile','X-Client-Info','X-Supabase-Api-Version'] as $h) {
           $v=$_SERVER['HTTP_'.strtoupper(str_replace('-','_',$h))] ?? ($h==='Content-Type'?($_SERVER['CONTENT_TYPE']??''):'');
           if ($h==='Authorization' && $v==='') $v=$_SERVER['HTTP_X_PROXY_AUTHORIZATION'] ?? $_SERVER['REDIRECT_HTTP_AUTHORIZATION'] ?? '';
           if ($v!=='' && !preg_match('/[\r\n]/',$v)) $headers[]=$h.': '.$v;
          }
          $c=curl_init('https://aqtupxpsqztihffplwpq.supabase.co'.$path.($q!==''?'?'.$q:''));
          $out=[];
          curl_setopt_array($c,[CURLOPT_CUSTOMREQUEST=>$method,CURLOPT_RETURNTRANSFER=>true,CURLOPT_CONNECTTIMEOUT=>5,CURLOPT_TIMEOUT=>20,CURLOPT_FOLLOWLOCATION=>false,CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2,CURLOPT_HTTPHEADER=>$headers,CURLOPT_HEADERFUNCTION=>function($c,$line) use (&$out) { if(preg_match('/^(content-type|content-range|range-unit|preference-applied):/i',$line)) $out[]=trim($line); return strlen($line); }]);
          if ($method==='HEAD') curl_setopt($c,CURLOPT_NOBODY,true);
          if (in_array($method,['POST','PATCH','DELETE'],true)) curl_setopt($c,CURLOPT_POSTFIELDS,$body);
          $result=curl_exec($c); $status=curl_getinfo($c,CURLINFO_HTTP_CODE); curl_close($c);
          if ($result===false || $status<200 || ($status>=300 && $status<400)) fail_request(502);
          http_response_code($status);
          foreach($out as $h) header($h);
          echo $result;
          PROXYPHP
          php -l deploy/assets/supabase-proxy.php
      - name: Publish test site
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -s deploy/index.html
          for file in deploy/assets/*; do
            curl --fail --silent --show-error --ssl-reqd --ftp-create-dirs --connect-timeout 20 --max-time 120 --user "$FTP_USERNAME:$FTP_PASSWORD" --upload-file "$file" "ftp://$FTP_SERVER/assets/${file##*/}"
          done
          curl --fail --silent --show-error --ssl-reqd --connect-timeout 20 --max-time 120 --user "$FTP_USERNAME:$FTP_PASSWORD" --upload-file deploy/index.html "ftp://$FTP_SERVER/index.html"
