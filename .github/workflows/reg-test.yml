name: REG.RU test deployment
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload index.html after checking FTPS (replaces test placeholder)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify encrypted FTP connection
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --fail --silent --show-error --ssl-reqd --connect-timeout 20 --max-time 60 --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/" --list-only
      - name: Publish test site
        if: ${{ inputs.publish }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -s index.html
          curl --fail --silent --show-error --ssl-reqd --connect-timeout 20 --max-time 120 --user "$FTP_USERNAME:$FTP_PASSWORD" --upload-file index.html "ftp://$FTP_SERVER/index.html"
