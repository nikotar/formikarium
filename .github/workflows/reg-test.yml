name: REG.RU test deployment
on:
  push:
    branches: [preview]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/reg-test.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to theantmill.online after checking FTPS
        type: boolean
        default: false
concurrency:
  group: reg-test
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify encrypted FTP connection
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --fail --silent --show-error --ssl-reqd --connect-timeout 20 --max-time 60 --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/" --list-only
      - name: Prepare self-contained test build
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          mkdir -p deploy/assets
          cp index.html deploy/index.html
          cp -r assets/. deploy/assets/
          curl --fail --silent --show-error --location --retry 3 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2' -o deploy/assets/supabase.js
          sed -i 's|https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2|./assets/supabase.js|' deploy/index.html
          test -s deploy/assets/studio-background.webp
          test -s deploy/assets/site.css
          test -s deploy/assets/calendar.js
          test -s deploy/assets/booking-stamp-10.png
          node --check deploy/assets/calendar.js
          test -s deploy/assets/oswald-cyrillic.woff2
      - name: Publish test site
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -s deploy/index.html
          for file in deploy/assets/* deploy/assets/.htaccess; do
            curl --fail --silent --show-error --ssl-reqd --ftp-create-dirs --connect-timeout 20 --max-time 120 --user "$FTP_USERNAME:$FTP_PASSWORD" --upload-file "$file" "ftp://$FTP_SERVER/assets/${file##*/}"
          done
          curl --fail --silent --show-error --ssl-reqd --connect-timeout 20 --max-time 120 --user "$FTP_USERNAME:$FTP_PASSWORD" --upload-file deploy/index.html "ftp://$FTP_SERVER/index.html"
