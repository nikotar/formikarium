name: REG.RU production deployment
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to theantmill.ru/formicarium after checking FTPS
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify encrypted FTP connection
        env:
          FTP_SERVER: ${{ secrets.PROD_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.PROD_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.PROD_FTP_PASSWORD }}
        run: |
          curl --fail --silent --show-error --ssl-reqd --connect-timeout 20 --max-time 60 --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/" --list-only
      - name: Prepare self-contained production build
        if: ${{ inputs.publish }}
        run: |
          mkdir -p deploy/assets
          cp index.html deploy/index.html
          curl --fail --silent --show-error --location --retry 3 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2' -o deploy/assets/supabase.js
          curl --fail --silent --show-error --location --retry 3 -A 'Mozilla/5.0' 'https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&display=swap' -o deploy/assets/oswald.css
          python3 - <<'PY'
          import pathlib, re, urllib.request
          root = pathlib.Path('deploy')
          css = root / 'assets/oswald.css'
          data = css.read_text()
          urls = set(re.findall(r'https://fonts\.gstatic\.com/[^)\s]+', data))
          assert urls, 'No font files found'
          for i, url in enumerate(sorted(urls)):
              name = 'oswald-' + str(i) + '.' + url.rsplit('.', 1)[-1]
              urllib.request.urlretrieve(url, root / 'assets' / name)
              data = data.replace(url, name)
          css.write_text(data)
          html = root / 'index.html'
          data = html.read_text()
          replacements = {
              'https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&display=swap': './assets/oswald.css',
              'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2': './assets/supabase.js',
          }
          for old, new in replacements.items():
              assert old in data, old
              data = data.replace(old, new)
          # Session persistence patch.
          changes = [
              ("if(btn.dataset.tab==='admin'&&admin){$('logout').click();return;}", ""),
              ("#logout{display:none!important;}", "#logout{margin:8px 0;padding:6px 12px;border-radius:999px;cursor:pointer}"),
              ("await db.auth.signOut();await reload();setInterval", "const session=checked(await db.auth.getSession()).session;if(session){const user=checked(await db.auth.getUser()).user;if(user?.id===ownerId){admin=true;$('loginBox').style.display='none';$('adminContent').style.display='block';$('logout').style.display='inline-block';}else{checked(await db.auth.signOut());}}await reload();setInterval"),
          ]
          for old, new in changes:
              assert data.count(old) == 1, old
              data = data.replace(old, new)
          for old, new in [
              ("@media(max-width:760px){.calendar-nav:has(.ant-week) strong{flex-basis:190px;width:190px}}", "@media(max-width:760px){.calendar-nav:has(.ant-week) strong{flex-basis:160px;width:160px}}"),
              ("@media(max-width:340px){.calendar-nav:has(.ant-week) strong{flex-basis:160px;width:160px}}", "@media(max-width:340px){.calendar-nav:has(.ant-week) strong{flex-basis:140px;width:140px}}"),
          ]:
              assert data.count(old) == 1, old
              data = data.replace(old, new)
          logo = re.search(r'<div class="logo"[^>]*>\s*(<svg\b.*?</svg>)', data, re.S)
          assert logo, 'Header logo not found'
          (root / 'assets/favicon.svg').write_text(logo.group(1))
          data = data.replace('</head>', '<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg"></head>', 1)
          html.write_text(data)
          PY
          test -s deploy/assets/supabase.js
      - name: Publish production site
        if: ${{ inputs.publish }}
        env:
          FTP_SERVER: ${{ secrets.PROD_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.PROD_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.PROD_FTP_PASSWORD }}
        run: |
          test -s deploy/index.html
          for file in deploy/assets/*; do
            curl --fail --silent --show-error --ssl-reqd --ftp-create-dirs --connect-timeout 20 --max-time 120 --user "$FTP_USERNAME:$FTP_PASSWORD" --upload-file "$file" "ftp://$FTP_SERVER/assets/${file##*/}"
          done
          curl --fail --silent --show-error --ssl-reqd --connect-timeout 20 --max-time 120 --user "$FTP_USERNAME:$FTP_PASSWORD" --upload-file deploy/index.html "ftp://$FTP_SERVER/index.html"
